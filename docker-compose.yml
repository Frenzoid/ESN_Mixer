version: '3.8'

services:
  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: song-queue-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - FRONTEND_URL=${FRONTEND_URL:-https://esn.frenzoid.dev}
    volumes:
      - queue-data:/app/data
    networks:
      - song-queue-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "https://esnb.frenzoid.dev/api/queue"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend React App (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_SOCKET_URL=${VITE_SOCKET_URL:-https://esnb.frenzoid.dev}
    container_name: song-queue-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - song-queue-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "https://esn.frenzoid.dev"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  song-queue-network:
    driver: bridge

volumes:
  queue-data:
    driver: local